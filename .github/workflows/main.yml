name: Pull Request tests
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  build:
    name: "HTML validation"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2 # Requried will all actions
    - name: Checks HTML5
      uses: Cyb3r-Jak3/html5validator-action@master
      with:
        root: .
        blacklist: ./partials
        css: true
        format: text
